<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Kerro · Back to your mailbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235b5bd6'/%3E%3Cstop offset='1' stop-color='%238b7cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M11.5 8.5v15M11.5 17l9-8.5M14.6 14l6.4 9.5' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root { --text: #0e1525; --body: #4a5568; --line: #e6eaf1; --soft: #f5f7fb; --blue: #5b5bd6; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--soft); color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 17px; line-height: 1.6;
}
main {
  width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 20px;
  padding: 28px 24px; box-shadow: 0 2px 4px rgba(14, 21, 37, 0.04), 0 18px 40px -18px rgba(14, 21, 37, 0.22);
}
h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
p { margin: 0; color: var(--body); }
a { color: var(--blue); }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div id="going">
    <h1>Taking you back to Kerro…</h1>
    <p>Your mailbox is being connected. This takes a moment.</p>
  </div>
  <div id="not-ours" hidden>
    <h1>This link does not lead anywhere</h1>
    <p>This page only takes you back to Kerro after you connect a mailbox. Open Kerro and press Connect again.</p>
  </div>
  <noscript>
    <h1>Your browser has scripts switched off</h1>
    <p>This page needs them to take you back to Kerro. Switch them on, then press Connect again in Kerro.</p>
  </noscript>
</main>
<script src="relay.js"></script>
</body>
</html>
